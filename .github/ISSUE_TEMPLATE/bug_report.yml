name: Bug report
description: Something in the pipeline does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        ./new-film.sh test && python kit/build.py --film films/test/film.json --steps voice,music,mix,site
    validations: { required: true }
  - type: textarea
    id: log
    attributes:
      label: First 40 lines of the log
      description: Render errors appear as `[pageerror] ...` — that line is usually the answer.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Debian 12, Python 3.12, Node 20, Chromium 153, 2 cores / 2 GB, no GPU"
  - type: textarea
    id: qa
    attributes:
      label: QA output (if the render finished)
      render: shell
