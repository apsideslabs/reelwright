name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Describe the film-making situation, not the implementation.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [voice, music/mix, render, scene/camera, graphics, docs, other]
